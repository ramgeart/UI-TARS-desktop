# UI-TARS Linux Agent Configuration
# ==================================

# Model Configuration
# -------------------
# Provider: openai, anthropic, or volcengine
provider = openai

# Model name (e.g., gpt-4-vision-preview, claude-3-5-sonnet, doubao-1-5-thinking-vision-pro-250428)
model = gpt-4-vision-preview

# API Key (can also be set via UI_TARS_API_KEY environment variable)
# api_key = your-api-key-here

# Base URL for custom API endpoints (optional)
# base_url = https://api.openai.com/v1/chat/completions

# Model parameters
temperature = 0.0
max_tokens = 4096

# Agent Configuration
# -------------------
# Maximum number of action loops
max_loop_count = 50

# Delay between action loops (milliseconds)
loop_interval_ms = 1000

# Retry Configuration
# -------------------
screenshot_retries = 3
model_retries = 3
execute_retries = 3

# Service Configuration
# ---------------------
# Unix socket path for service mode
socket_path = /var/run/ui-tars-agent.sock

# Log file path
log_path = /var/log/ui-tars-agent.log

# X11 Display (usually auto-detected)
# display = :0
